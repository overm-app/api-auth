services:
  postgres-api-auth:
    container_name: postgres-api-auth
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    image: postgres:18
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "${DB_PORT}:5432"
    networks:
      - overm-network
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  api-auth:
    image: api-auth:dev
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-auth-dev
    depends_on:
      postgres-api-auth:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      overm-network:
        aliases: [api-auth-svc]
    ports:
      - "${API_AUTH_HOST:-8081}:8080"
    restart: unless-stopped
    volumes:
      - ./config/config.yaml:/etc/config/config.yaml:ro

volumes:
  postgres_data:

networks:
  overm-network:
    external: true