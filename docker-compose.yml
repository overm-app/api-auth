services:
  postgres:
    container_name: postgresDB
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    image: postgres:18
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "${DB_PORT}:5432"
    networks:
      - overm-network
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  api-auth:
    build:
      context: .
      dockerfile: Dockerfile
      privileged: false
    container_name: api-auth
    depends_on:
      - postgres
    env_file:
      - .env_compose
    environment:
      ENV: "develop"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - overm-network
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    restart: unless-stopped

networks:
  overm-network:
    external: true

volumes:
  postgres_data: