services:
  postgres:
    container_name: postgresDB
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - overm-network

  api-auth:
    container_name: api-auth
    image: api-auth:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
      privileged: false
    restart: unless-stopped
    environment:
      ENV: "develop"
    env_file:
      - .env_compose
    ports:
      - "${SERVER_PORT}:8081"
    depends_on:
      - postgres
    networks:
      - overm-network

volumes:
  postgres_data:

networks:
  overm-network:
    external: true